<!DOCTYPE html>
<html>
<head>
    <title>Edit Issue</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f7fb;
        }

        .header {
            background: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .nav-links a {
            margin-left: 12px;
            text-decoration: none;
            color: #4facfe;
            font-weight: bold;
        }

        .form-card {
            background: white;
            width: 450px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0 16px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4facfe;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #2f8ef5;
        }

        .alert {
            background: #d4edda;
            color: #155724;
            border-left: 6px solid #28a745;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .fade-out {
            animation: fadeOut 0.6s ease forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Edit Issue</h2>
        <div class="nav-links">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'my_issues' %}">My Issues</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>
    </div>

    <div class="form-card">

        {% if messages %}
            {% for message in messages %}
                <div class="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Title:</label>
            <input type="text" name="title" value="{{ issue.title }}" required>

            <label>Description:</label>
            <textarea name="description" required>{{ issue.description }}</textarea>

            <label>Status:</label>
            <select name="status">
                <option value="pending" {% if issue.status == "pending" %}selected{% endif %}>Pending</option>
                <option value="in_progress" {% if issue.status == "in_progress" %}selected{% endif %}>In Progress</option>
                <option value="resolved" {% if issue.status == "resolved" %}selected{% endif %}>Resolved</option>
            </select>

            <button type="submit">
                <i class="fas fa-save"></i> Update Issue
            </button>
        </form>
    </div>

    <script>
        setTimeout(() => {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(alert => {
                alert.classList.add('fade-out');
                setTimeout(() => {
                    alert.remove();
                }, 600);
            });
        }, 3000);
    </script>

</body>
</html>
